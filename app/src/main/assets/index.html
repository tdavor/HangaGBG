<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https:; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<title>Hänga Gbg</title>
<link rel="stylesheet" href="style.css">
<script src="config.js" defer></script>
<script src="firebase.js" defer></script>
<script src="app.js" defer></script>

<body>
<header><a href="#discover" class="brand"><img class="brand-mark" src="brand-mark.png" alt="" width="36" height="36"> Hänga Gbg</a><div id="header-actions"></div></header>
<main id="main"></main>
<dialog id="delete-meetup-dialog" aria-labelledby="delete-meetup-title" aria-describedby="delete-meetup-name">

  <p id="delete-meetup-name"></p>
  <div class="actions">
    <button id="keep-meetup" type="button" autofocus></button>

<p id="status" role="status" aria-live="polite" hidden></p>
