plugins {
    id 'com.android.application' version '8.8.2'
    id 'com.google.gms.google-services' version '4.4.4' apply false
}
if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'
android {
    namespace 'se.hangagbg.android'
    compileSdk 35
    defaultConfig {
        applicationId 'se.hangagbg.android'
        minSdk 26
        targetSdk 35
        versionCode 33
        versionName '1.8.3'
    }
    flavorDimensions += 'delivery'
    productFlavors {
        push { dimension 'delivery' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    pushImplementation "com.google.firebase:firebase-messaging:25.0.1"
    pushImplementation "androidx.credentials:credentials:1.3.0"
    pushImplementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    pushImplementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
