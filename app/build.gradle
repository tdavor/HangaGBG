plugins {
    id 'com.android.application' version '8.9.2'
    id 'com.google.gms.google-services' version '4.4.4' apply false
}
if (file('google-services.json').exists()) apply plugin: 'com.google.gms.google-services'
def uploadStore = System.getenv('HANGA_KEYSTORE')
android {
    namespace 'se.hangagbg.android'
    compileSdk 36
    defaultConfig {
        applicationId 'se.hangagbg.android'
        minSdk 26
        targetSdk 35
        versionCode 36
        versionName '1.8.6'
    }
    signingConfigs {
        if (uploadStore) {
            playUpload {
                storeFile file(uploadStore)
                storePassword System.getenv('HANGA_STOREPASS')
                keyAlias System.getenv('HANGA_KEY_ALIAS')
                keyPassword System.getenv('HANGA_KEYPASS')
            }
        }
    }
    flavorDimensions += 'delivery'
    productFlavors {
        push { dimension 'delivery' }
        play {
            dimension 'delivery'
            targetSdk 36
            if (uploadStore) signingConfig signingConfigs.playUpload
        }
    }
    sourceSets {
        push.java.srcDirs += 'src/sideload/java'
        play.java.srcDirs += 'src/push/java'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    pushImplementation "com.google.firebase:firebase-messaging:25.0.1"
    playImplementation "com.google.firebase:firebase-messaging:25.0.1"
}
