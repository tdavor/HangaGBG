name: Build Android APKs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Firebase backend
        run: node --test backend/test/*.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - name: Build and verify APKs
        env:
          FIREBASE_CLIENT_CONFIG: ${{ secrets.HANGA_GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$FIREBASE_CLIENT_CONFIG" ]]; then
            printf '%s' "$FIREBASE_CLIENT_CONFIG" > app/google-services.json
          fi
          bash scripts/build-apk.sh firebase
          bash scripts/build-apk.sh demo
      - uses: actions/upload-artifact@v4
        with:
          name: HangaGBG
          path: app/build/manual/firebase/HangaGBG.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hanga-Gbg-Demo
          path: app/build/manual/demo/Hanga-Gbg-Demo.apk
