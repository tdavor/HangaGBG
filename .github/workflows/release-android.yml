name: Publish signed Android release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - 'release/v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve requested release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - name: Build signed HangaGBG APK
        env:
          FIREBASE_CLIENT_CONFIG: ${{ secrets.HANGA_GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.HANGA_KEYSTORE_BASE64 }}
          HANGA_STOREPASS: ${{ secrets.HANGA_STOREPASS }}
          HANGA_KEYPASS: ${{ secrets.HANGA_KEYPASS }}
          HANGA_KEY_ALIAS: ${{ secrets.HANGA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing HANGA_KEYSTORE_BASE64}"
          : "${HANGA_STOREPASS:?Missing HANGA_STOREPASS}"
          : "${HANGA_KEYPASS:?Missing HANGA_KEYPASS}"
          : "${HANGA_KEY_ALIAS:?Missing HANGA_KEY_ALIAS}"
          export HANGA_KEYSTORE="$RUNNER_TEMP/hangagbg-release.keystore"
          trap 'rm -f "$HANGA_KEYSTORE" app/google-services.json' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HANGA_KEYSTORE"
          : "${FIREBASE_CLIENT_CONFIG:?Missing HANGA_GOOGLE_SERVICES_JSON}"
          printf '%s' "$FIREBASE_CLIENT_CONFIG" > app/google-services.json
          bash scripts/build-apk.sh firebase
          bash scripts/build-play-bundle.sh
          apk=app/build/manual/firebase/HangaGBG.apk
          version=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" |
            sed -n "1s/.*versionName='\([^']*\)'.*/\1/p")
          test "v$version" = "$RELEASE_TAG"
      - name: Create tag for a release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Create only: GitHub rejects an existing tag instead of moving it.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
      - name: Attach APK and Play bundle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=app/build/manual/firebase/HangaGBG.apk
          legacy="$RUNNER_TEMP/Hanga-Gbg-Firebase.apk"
          # Version 1.3.2 checks this exact asset name before it knows the new name.
          cp "$apk" "$legacy"
          gh release create "$RELEASE_TAG" "$apk" "$legacy#HangaGBG – compatibility for v1.3.2" app/build/outputs/play/HangaGBG-Play.aab app/build/outputs/play/HangaGBG-Play-info.json \
            --verify-tag --generate-notes --latest
