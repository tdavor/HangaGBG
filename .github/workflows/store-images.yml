name: Prepare Play Store images
on:
  push:
    branches: [codex/play-store-screenshots]
    paths: [.github/workflows/store-images.yml]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture Swedish app screens
        run: |
          mkdir -p store-images
          cp app/src/main/res/drawable/logo_mark.png app/src/main/assets/store-icon.png
          python3 -m http.server 8767 --bind 127.0.0.1 --directory app/src/main/assets > /tmp/hanga-store-server.log 2>&1 &
          cat > capture.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            const page=await browser.newPage({viewport:{width:360,height:800},deviceScaleFactor:3});
            await page.route('**/config.js',r=>r.fulfill({contentType:'application/javascript',body:'window.HANGA_DEMO=true;window.HANGA_FIREBASE={url:"",key:""};'}));
            await page.addInitScript(()=>{localStorage.lang='sv';localStorage.hangaDemoToken='demo';});
            await page.goto('http://127.0.0.1:8767');
            await page.waitForTimeout(1000);
            for(const [route,file] of [['discover','01-upptack'],['event/1','02-traff'],['create','03-skapa-traff'],['discover','04-traffar']]){
              await page.goto('http://127.0.0.1:8767/#'+route);
              await page.waitForTimeout(700);
              await page.evaluate("if(user){user.admin=0;render();}window.scrollTo(0,0)");
              if(route==='create'){
                await page.locator('input[name="title"]').fill('Fika och nya vänner i Haga');
                await page.locator('textarea[name="description"]').fill('Vill du ta en fika och lära känna nya människor? Vi ses i Haga. Du är varmt välkommen att komma själv!');
              }
              if(file==='04-traffar') await page.locator('#results').scrollIntoViewIfNeeded();
              await page.screenshot({path:'store-images/'+file+'.png'});
              console.log(file,await page.locator('main').innerText().then(s=>s.slice(0,250)));
            }
            const icon=await browser.newPage({viewport:{width:512,height:512},deviceScaleFactor:1});
            const iconData=require('fs').readFileSync('app/src/main/res/drawable/logo_mark.png').toString('base64');
            await icon.setContent('<html><body style="margin:0"><img src="data:image/png;base64,'+iconData+'" style="display:block;width:512px;height:512px"></body></html>',{waitUntil:'domcontentloaded'});
            await icon.waitForTimeout(500);
            await icon.screenshot({path:'store-images/HangaGBG-icon-512.png'});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture.cjs
          echo "Swedish screenshots of the real app web UI, rendered at phone size with local sample events. No real member data. Icon exported from the existing app artwork. Screenshots are not Android device captures." > store-images/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HangaGBG-Play-Store-images
          path: store-images/
